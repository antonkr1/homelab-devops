services:
  runner:
    image: gitea/act_runner:latest
    container_name: gitea-runner
    environment:
      - GITEA_INSTANCE_URL=http://192.168.1.205:3000
      - GITEA_RUNNER_REGISTRATION_TOKEN=MON_TOKEN_GITEA
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - runner_data:/data
    restart: unless-stopped
    network_mode: "host"

volumes:
  runner_data:
