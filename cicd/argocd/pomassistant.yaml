apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pomassistant
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/antonkr1/homelab-devops.git
    targetRevision: main
    path: apps/pomassistant
  destination:
    server: https://kubernetes.default.svc
    namespace: pomassistant
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
