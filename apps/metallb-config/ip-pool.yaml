# Plage d'adresses que MetalLB peut attribuer aux services de type LoadBalancer.
# Doit être libre et EN DEHORS de la plage DHCP de la Freebox.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: homelab-pool
  namespace: metallb-system
spec:
  addresses:
    - 192.168.1.230-192.168.1.240
---
# Mode "couche 2" : MetalLB répond aux requêtes ARP pour ces adresses depuis un des nœuds.
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: homelab-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - homelab-pool
