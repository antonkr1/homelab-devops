---

- name: Passer sudo sans mdp pour push des playbook
  hosts: k8s_cluster
  become: true
  tasks:
    - name: Fichier sudoers
      ansible.builtin.copy:
        dest: /etc/sudoers.d/anton-nopasswd
        content: |
          anton ALL=(ALL) NOPASSWD: ALL
        owner: root
        group: root
        mode: '0440'
        validate: /usr/sbin/visudo -cf %s
