---

- name: Régénérer les clés d'hôte SSH des nœuds K8s
  hosts: k8s_cluster
  become: true
  serial: 1

  tasks:
    - name: Supprimer les anciennes clés d'hôte
      ansible.builtin.shell: rm -f /etc/ssh/ssh_host_*
      changed_when: true

    - name: Régénérer les clés d'hôte
      ansible.builtin.command: dpkg-reconfigure openssh-server
      environment:
        DEBIAN_FRONTEND: noninteractive
      changed_when: true

    - name: Redémarrer SSH
      ansible.builtin.service:
        name: ssh
        state: restarted
