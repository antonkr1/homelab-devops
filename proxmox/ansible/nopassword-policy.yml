---

- name: Sécurisation connexion SSH
  hosts: all:!control
  become: true
  serial: 1
  tasks:
    - name: Envoie clé SSH
      ansible.posix.authorized_key:
        user: "{{ ansible_user }}"
        key: "{{ lookup('file', '~/.ssh/id_ed25519.pub') }}"

    - name: Copie fichier conf
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/00-no-password.conf
        content: |
          PasswordAuthentication no
        owner: root
        group: root
        mode: '0644'
      become: true
      notify: reload ssh

    - name: Validation config
      ansible.builtin.command: sshd -t
      changed_when: false

    - name: Recharger SSH maintenant
      ansible.builtin.meta: flush_handlers

    - name: Verifier la valeur
      ansible.builtin.command: sshd -T
      register: sshd_conf
      changed_when: false
      failed_when: "'passwordauthentication no' not in sshd_conf.stdout"

  handlers:
  - name: reload ssh
    ansible.builtin.service:
      name: ssh
      state: reloaded
