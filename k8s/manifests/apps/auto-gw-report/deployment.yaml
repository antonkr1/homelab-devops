apiVersion: apps/v1
kind: Deployment
metadata:
  name: auto-gw-report
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auto-gw-report
  template:
    metadata:
      labels:
        app: auto-gw-report
    spec:
      containers:
      - name: auto-gw-report
        image: antnk/auto-gw-report:latest
        ports:
        - containerPort: 8000
      imagePullSecrets:
      - name: regcred
---
apiVersion: v1
kind: Service
metadata:
  name: auto-gw-report-service
spec:
  type: NodePort
  selector:
    app: auto-gw-report
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30080
