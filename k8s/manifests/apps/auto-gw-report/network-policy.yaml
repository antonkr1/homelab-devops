apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auto-gw-report-policy
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: auto-gw-report
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8000
